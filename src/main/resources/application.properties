spring.application.name=recruiter-visual-api

# Porta definida pela plataforma de hospedagem via PORT. Padrão local: 8080.
server.port=${PORT:8080}

# Banco vem de DB_URL, DB_USERNAME e DB_PASSWORD. URL e usuário têm padrão do Postgres local de desenvolvimento.
# DB_PASSWORD não tem padrão: deve vir sempre da variável de ambiente. Nunca defini-la aqui.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/recruiter_visual}
spring.datasource.username=${DB_USERNAME:recruiter}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# jwt.secret vem da variável de ambiente JWT_SECRET (mínimo 32 bytes). Não definir aqui.
jwt.expiration=1h

# Única origem aceita pelo CORS: a URL do frontend, vinda de FRONTEND_URL (sem barra no final). Padrão local: Vite.
cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# SMTP do código de verificação de e-mail. Padrão local: Mailpit (localhost:1025, sem autenticação).
# Credenciais vêm só de variáveis de ambiente; nunca defini-las aqui.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:no-reply@recruitervisual.local}
# SMTPS (TLS implícito, ex.: porta 465). Desligado por padrão: o Mailpit local não usa TLS.
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLED:false}
# Sem timeout, um SMTP travado prenderia a requisição de cadastro indefinidamente.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
